<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amber Room — Выбор даты и времени</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="page">
      
      <!-- Шапка -->
      <header class="header">
        <div class="logo">
          <div class="logo-title">AMBER ROOM</div>
          <div class="logo-subtitle">САЛОН КРАСОТЫ</div>
        </div>
        <div class="booking-info">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 6H14" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 1V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M11 1V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Онлайн-запись · Шаг 3 из 6</span>
        </div>
      </header>

      <!-- Основной контент -->
      <main class="main">
        
        <!-- Индикатор шага -->
        <div class="step-indicator">
          <div class="step-number">3</div>
          <div class="step-line"></div>
          <div class="step-text">ШАГ 3 ИЗ 6</div>
        </div>

        <!-- Заголовок -->
        <h1 class="page-title">Выбор даты и времени</h1>
        <p class="page-subtitle">Выберите удобный день и свободное время</p>

        <!-- Контейнер с календарём и временем -->
        <div class="calendar-section">
          
          <!-- Календарь (используем section для семантики) -->
          <section class="calendar-card">
            <div class="calendar-header">
              <button class="calendar-nav calendar-nav-prev" type="button">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M11 14L6 9L11 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <h2 class="calendar-month">Июнь 2025</h2>
              <button class="calendar-nav calendar-nav-next" type="button">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M7 14L12 9L7 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            
            <div class="calendar-grid">
              <div class="weekday">ПН</div>
              <div class="weekday">ВТ</div>
              <div class="weekday">СР</div>
              <div class="weekday">ЧТ</div>
              <div class="weekday">ПТ</div>
              <div class="weekday">СБ</div>
              <div class="weekday">ВС</div>
              
              <!-- 1 июня 2025 - это воскресенье, поэтому 6 пустых ячеек -->
              <button class="day day-empty" type="button" disabled></button>
              <button class="day day-empty" type="button" disabled></button>
              <button class="day day-empty" type="button" disabled></button>
              <button class="day day-empty" type="button" disabled></button>
              <button class="day day-empty" type="button" disabled></button>
              <button class="day day-empty" type="button" disabled></button>
              
              <button class="day" type="button">1</button>
              <button class="day" type="button">2</button>
              <button class="day" type="button">3</button>
              <button class="day" type="button">4</button>
              <button class="day" type="button">5</button>
              <button class="day" type="button">6</button>
              <button class="day" type="button">7</button>
              <button class="day" type="button">8</button>
              <button class="day" type="button">9</button>
              <button class="day" type="button">10</button>
              <button class="day" type="button">11</button>
              <button class="day" type="button">12</button>
              <button class="day" type="button">13</button>
              <button class="day" type="button">14</button>
              <button class="day day-selected" type="button">15</button> <!-- Добавлено состояние выбора -->
              <button class="day" type="button">16</button>
              <button class="day" type="button">17</button>
              <button class="day" type="button">18</button>
              <button class="day" type="button">19</button>
              <button class="day" type="button">20</button>
              <button class="day" type="button">21</button>
              <button class="day" type="button">22</button>
              <button class="day" type="button">23</button>
              <button class="day" type="button">24</button>
              <button class="day" type="button">25</button>
              <button class="day" type="button">26</button>
              <button class="day" type="button">27</button>
              <button class="day" type="button">28</button>
              <button class="day" type="button">29</button>
              <button class="day" type="button">30</button>
            </div>

            <div class="calendar-hint">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M2 6H14" stroke="currentColor" stroke-width="1.5"/>
                <path d="M5 1V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M11 1V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span>Нажмите на дату, чтобы увидеть доступное время</span>
            </div>
          </section>

          <!-- Время (используем section для семантики) -->
          <section class="time-card">
            <h2 class="time-title">Свободное время</h2>
            <p class="time-subtitle">Выберите удобное время для записи</p> <!-- Исправлен текст -->
            
            <div class="time-slots">
              <!-- Добавлен атрибут disabled для занятых слотов -->
              <button class="time-slot time-slot-booked" disabled type="button">
                <span>10:00 · Занято</span>
              </button>
              <button class="time-slot" type="button">11:00</button>
              <button class="time-slot time-slot-selected" type="button">12:00</button>
              <button class="time-slot" type="button">13:00</button>
              <button class="time-slot" type="button">14:00</button>
              <button class="time-slot time-slot-booked" disabled type="button">
                <span>15:00 · Занято</span>
              </button>
              <button class="time-slot" type="button">16:00</button>
              <button class="time-slot" type="button">17:00</button>
            </div>

            <div class="time-legend">
              <div class="legend-item">
                <div class="legend-dot legend-free"></div>
                <span>Свободно</span>
              </div>
              <div class="legend-item">
                <div class="legend-dot legend-booked"></div>
                <span>Занято</span>
              </div>
              <div class="legend-item">
                <div class="legend-dot legend-selected"></div>
                <span>Выбрано</span>
              </div>
            </div>
          </section>
        </div>

        <!-- Разделитель -->
        <div class="divider"></div>

        <!-- Кнопки навигации -->
        <div class="navigation">
          <button class="btn btn-back" type="button">Назад</button>
          <button class="btn btn-next" type="button">Далее</button>
        </div>
      </main>
    </div>
  </body>
</html>
